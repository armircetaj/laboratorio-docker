x-app: &default-app
  build:
    context: "."
  image: posio-app:${APP_VERSION:-1.0.0}
  depends_on:
    redis:
      condition: service_healthy
  volumes:
    - .:/app
    - spatialite:/app/db
  environment:
    - REDIS_HOST=${REDIS_HOST:-redis}
  networks:
    - net
  restart: unless-stopped

services:
  redis:
    image: "redis:${REDIS_TAG:-7.2.4-bookworm}"
    volumes:
      - "redis:/data"
    networks:
      - net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    <<: *default-app
    ports:
      - "8001:8000"
    command: ["manage.py", "runserver", "0.0.0.0:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  gameloops:
    <<: *default-app
    command: ["manage.py", "startgameloops"]

networks:
  net:
    name: net

volumes:
  spatialite: {}
  redis: {}